<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message from Kevin</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-color);
        }
        
        .message-container {
            width: 90%;
            max-width: 600px;
            animation: fadeIn 1s;
        }
        
        .message-paper {
            position: relative;
            background: #fff9fa;
            padding: 30px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            background-image: 
                linear-gradient(#f9ecef 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: -1px -1px;
            border: 1px solid #ffe0eb;
            animation: float 4s ease-in-out infinite;
        }
        
        .message-header {
            border-bottom: 2px solid #ffd6e5;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .message-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #e75480;
            margin-bottom: 10px;
        }
        
        .message-meta {
            display: flex;
            justify-content: space-between;
            color: #8b5d77;
            font-size: 0.9rem;
        }
        
        .message-content {
            color: #444;
            line-height: 1.6;
            font-family: 'Poppins', sans-serif;
            white-space: pre-line; /* Preserves line breaks */
            padding: 0 0 20px 0;
            position: relative;
            z-index: 1;
        }
        
        .message-content::after {
            content: '';
            position: absolute;
            width: 3px;
            top: 0;
            bottom: 0;
            left: -15px;
            background-color: rgba(255, 133, 162, 0.3);
            z-index: -1;
        }
        
        .back-button {
            text-align: center;
            margin-top: 25px;
        }
        
        .back-button button {
            background: #ffd6e5;
            color: #e75480;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Dancing Script', cursive;
        }
        
        .back-button button:hover {
            background: #ffb6c1;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 182, 193, 0.4);
        }
        
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        #delete-btn {
            background: #ffb6c1;
            color: #e75480;
            display: none; /* Hidden by default, shown for Kevin */
        }
        
        #delete-btn:hover {
            background: #ff9db4;
        }
        
        .floating-icons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        
        .floating-icon {
            position: absolute;
            bottom: -50px;
            opacity: 1;  /* Change from 0.8 to 1 for full opacity */
            animation-name: float-ascending;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        
        /* Add the floating icon positions from your main CSS */
        .floating-icon:nth-child(1) { left: 5%; animation-duration: 8s; }
        .floating-icon:nth-child(2) { left: 15%; animation-duration: 10s; animation-delay: 1s; }
        .floating-icon:nth-child(3) { left: 25%; animation-duration: 7s; animation-delay: 2.5s; }
        .floating-icon:nth-child(4) { left: 35%; animation-duration: 9s; animation-delay: 3s; }
    </style>
</head>
<body>
    <div class="floating-icons">
        <!-- Add a few floating icons for decoration (like in your main page) -->
        <div class="floating-icon"><img src="mariepixel.png" alt="Icon 1"></div>
        <div class="floating-icon"><img src="mariewalk.png" alt="Icon 2"></div>
        <div class="floating-icon"><img src="hmp.png" alt="Icon 3"></div>
        <div class="floating-icon"><img src="cina.png" alt="Icon 4"></div>
    </div>

    <div class="message-container">
        <div class="message-paper">
            <div class="message-header">
                <h1 class="message-title" id="message-title">Loading message...</h1>
                <div class="message-meta">
                    <span id="message-from">From: Kevin</span>
                    <span id="message-date">Date: Loading...</span>
                </div>
            </div>
            <div class="message-content" id="message-content">
                Loading message content...
            </div>
            <div class="actions">
                <div class="back-button">
                    <button id="back-btn">Back to Inbox</button>
                </div>
                <div class="back-button">
                    <button id="delete-btn">Delete Message</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase configuration - same as in index.html
        const firebaseConfig = {
            apiKey: "AIzaSyDeUJgPeP4hFdZk5Esfqx0iV6-_4EzaVrA",
            authDomain: "marie-kevin-messages.firebaseapp.com",
            databaseURL: "https://marie-kevin-messages-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "marie-kevin-messages",
            storageBucket: "marie-kevin-messages.firebasestorage.app",
            messagingSenderId: "994244523164",
            appId: "1:994244523164:web:2445e9a0df367dd33e6959",
            measurementId: "G-L6H87ZWC70"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        document.addEventListener('DOMContentLoaded', () => {
            // Get message ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const messageId = urlParams.get('id');
            
            if (!messageId) {
                window.location.href = 'index.html'; // Redirect back to index if no ID
                return;
            }
            
            // Check if it's Kevin accessing the page (simplified auth)
            function isKevin() {
                const isKevinKey = localStorage.getItem('isKevin');
                return isKevinKey === 'true';
            }
            
            // Get message details
            db.collection('messages').doc(messageId).get()
                .then(doc => {
                    if (doc.exists) {
                        const message = doc.data();
                        
                        // Set page title to message title
                        document.title = `Message: ${message.title}`;
                        
                        // Update UI with message details
                        document.getElementById('message-title').textContent = message.title;
                        document.getElementById('message-from').textContent = `From: ${message.from}`;
                        document.getElementById('message-date').textContent = `Date: ${message.date || 'Unknown'}`;
                        document.getElementById('message-content').textContent = message.content;
                        
                        // Mark message as read
                        db.collection('messages').doc(messageId).update({
                            read: true
                        }).catch(error => {
                            console.error('Error marking message as read:', error);
                        });
                        
                        // Show delete button only for Kevin
                        const deleteBtn = document.getElementById('delete-btn');
                        if (isKevin()) {
                            deleteBtn.style.display = 'block';
                        }
                    } else {
                        document.getElementById('message-title').textContent = 'Message not found';
                        document.getElementById('message-content').textContent = 'This message may have been deleted or does not exist.';
                    }
                })
                .catch(error => {
                    console.error('Error getting message:', error);
                    document.getElementById('message-title').textContent = 'Error loading message';
                    document.getElementById('message-content').textContent = `An error occurred: ${error.message}`;
                });
            
            // Set up back button
            document.getElementById('back-btn').addEventListener('click', () => {
                window.location.href = 'index.html?section=messages';
            });
            
            // Set up delete button
            document.getElementById('delete-btn').addEventListener('click', () => {
                if (!messageId) return;
                
                if (confirm('Are you sure you want to delete this message?')) {
                    db.collection('messages').doc(messageId).delete()
                        .then(() => {
                            alert('Message deleted!');
                            window.location.href = 'index.html';
                        })
                        .catch(error => {
                            alert('Error deleting message: ' + error.message);
                        });
                }
            });
        });
    </script>
</body>
</html>
