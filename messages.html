<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Messages</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="music-player">
        <audio id="background-music" src="music.mp3" autoplay loop></audio>
        <button id="play-pause-btn">
            <span class="play-icon">▶️</span>
            <span class="pause-icon" style="display:none;">⏸️</span>
        </button>
    </div>
    <script>
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.querySelector('.play-icon');
        const pauseIcon = document.querySelector('.pause-icon');
        const audio = document.getElementById('background-music');
        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'inline';
            } else {
                audio.pause();
                playIcon.style.display = 'inline';
                pauseIcon.style.display = 'none';
            }
        });
    </script>

    <div id="messages-section" class="messages-container">
        <h2>Inbox 💌</h2>
        <div class="tabs">
            <button class="tab-btn active" data-author="all">All</button>
            <button class="tab-btn" data-author="unread">Unread</button>
            <button class="tab-btn" data-author="read">Read</button>
        </div>
        <div id="messages-list">
            <!-- Messages will be loaded here by JS -->
        </div>
        <form id="kevin-message-form" style="margin-top:30px;">
            <h3>Send a message to Marie</h3>
            <input type="text" id="message-title" placeholder="Title" required>
            <textarea id="message-content" placeholder="Your sweet message..." required></textarea>
            <button type="button" id="send-message">Send Message</button>
        </form>
    </div>
    <a href="envelope.html"><button>Back to Letter</button></a>
    <script src="js/messages.js"></script>
</body>
</html>
